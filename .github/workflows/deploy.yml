# One button for the API and the admin panel: Actions → Deploy → Run workflow.
# The tests run first; only if they pass is anything built and uploaded over
# SSH (scripts/deploy.mjs). Setting it up: docs/deployment/shared-hosting.md →
# "Tek tuşla: GitHub Actions".
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Nereye
        type: choice
        options: [staging, production]
        default: staging
      target:
        description: Ne gitsin
        type: choice
        options: [all, api, admin]
        default: all
      dry_run:
        description: Deneme (yalnızca neyin değişeceğini listeler, hiçbir şey yüklemez)
        type: boolean
        default: false

permissions:
  contents: read

# One deploy per environment at a time; a second one waits instead of racing.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, gd, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
          tools: composer:v2
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: composer install --no-interaction --no-progress
        working-directory: apps/api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:api

  deploy:
    name: Deploy ${{ inputs.target }} → ${{ inputs.environment }}
    needs: verify
    # Production only ever gets what is on main.
    if: inputs.environment != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: pnpm install --frozen-lockfile

      - name: Write the API's .env
        if: inputs.target != 'admin'
        env:
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
        run: |
          if [ -z "$API_ENV_FILE" ]; then
            echo "::error::The $ENVIRONMENT environment has no API_ENV_FILE secret (the whole apps/api/.env.$ENVIRONMENT)."
            exit 1
          fi
          umask 077
          printf '%s\n' "$API_ENV_FILE" > "apps/api/.env.$ENVIRONMENT"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::The $ENVIRONMENT environment needs the SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS secrets."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts ~/.ssh/config

      - name: Build and upload
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_API_DIR: ${{ vars.DEPLOY_API_DIR }}
          DEPLOY_ADMIN_DIR: ${{ vars.DEPLOY_ADMIN_DIR }}
          DEPLOY_PHP: ${{ vars.DEPLOY_PHP }}
          DEPLOY_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/deploy.mjs "$ENVIRONMENT" "$TARGET"

      - name: Forget the secrets
        if: always()
        run: rm -rf ~/.ssh/id_deploy "apps/api/.env.$ENVIRONMENT" dist-deploy
