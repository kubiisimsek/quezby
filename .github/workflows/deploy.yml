# One button for the API and the admin panel: Actions → Deploy → Run workflow.
# The tests run first; only if they pass does `pnpm deploy:<environment>`
# (scripts/deploy.mjs) build, give each part its release and upload it
# through cPanel's API. The API's .env stays on the server and is never sent.
#
# Repository secrets: CPANEL_USER, CPANEL_TOKEN.
# Repository variables: DEPLOY_STAGING_API_DIR, DEPLOY_STAGING_ADMIN_DIR,
# DEPLOY_PROD_API_DIR, DEPLOY_PROD_ADMIN_DIR.
# docs/deployment/shared-hosting.md → "Tek tuşla: GitHub Actions".
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Nereye
        type: choice
        options: [staging, production]
        default: staging
      only:
        description: Ne gitsin
        type: choice
        options: [all, api, admin]
        default: all
      bump:
        description: Sürümün hangi hanesi artsın (major.minor.patch.minipatch)
        type: choice
        options: [minipatch, patch, minor, major]
        default: minipatch
      version:
        description: Ya da tam sürüm (ör. 1.01.01.01, boşsa yukarıdaki artış)
        type: string
        required: false
      dry_run:
        description: Deneme (kontrol eder ve derler, hiçbir şey yüklemez)
        type: boolean
        default: false

permissions:
  contents: read

# One deploy per environment at a time; a second one waits instead of racing.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, gd, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
          tools: composer:v2
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: composer install --no-interaction --no-progress
        working-directory: apps/api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:api

  deploy:
    name: Deploy ${{ inputs.only }} → ${{ inputs.environment }}
    needs: verify
    # Production only ever gets what is on main.
    if: inputs.environment != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: pnpm install --frozen-lockfile

      - name: Deploy
        env:
          DEPLOY_CPANEL_USER: ${{ secrets.CPANEL_USER }}
          DEPLOY_CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          DEPLOY_STAGING_API_DIR: ${{ vars.DEPLOY_STAGING_API_DIR }}
          DEPLOY_STAGING_ADMIN_DIR: ${{ vars.DEPLOY_STAGING_ADMIN_DIR }}
          DEPLOY_PROD_API_DIR: ${{ vars.DEPLOY_PROD_API_DIR }}
          DEPLOY_PROD_ADMIN_DIR: ${{ vars.DEPLOY_PROD_ADMIN_DIR }}
          ONLY: ${{ inputs.only }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -- --only "$ONLY" --bump "$BUMP" --version "$VERSION"
          if [ "$DRY_RUN" = true ]; then set -- "$@" --dry-run; fi
          pnpm "deploy:$ENVIRONMENT" "$@"

      - name: Forget the build
        if: always()
        run: rm -rf dist-deploy
